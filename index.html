<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BurgerHouse - BestellApp</title>
  <link rel="shortcut icon" href="assets/icon/main logo.png" type="image/x-icon">
  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <header class="header">
    <div class="header-inner">
      <a class="header-logo" href="./index.html" aria-label="BestellApp - zur Startseite">
        <img src="assets/icon/app logo.png" alt="BestellApp Logo">
      </a>
      <button class="header-menu-button" type="button" aria-label="Menü öffnen">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M3 6h18M3 12h18M3 18h18" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" />
        </svg>
      </button>
    </div>
  </header>

  <section class="hero">
    <img class="hero-image" src="assets/img/pizza and burger.png" alt="Burger, Pizza und Salate auf einem Holztisch">
    <img class="hero-logo" src="assets/icon/main logo.png" alt="BurgerHouse Logo">
  </section>

  <section class="restaurant">
    <div class="restaurant-title-row">
      <h1 class="restaurant-name"><span class="restaurant-name-accent">Burger</span>House</h1>
      <span class="restaurant-rating" role="img" aria-label="Bewertung 4,1 von 5 Sternen, 317 Bewertungen">★ 4,1
        (317)</span>
    </div>
    <p class="restaurant-description">Das Beste aus Burgern, Pizza und Salaten - alles an einem großartigen Ort.</p>
  </section>

  <main class="content">
    <div id="menu" class="menu"></div>

    <aside class="basket" aria-labelledby="basket-title">
      <div class="basket-header">
        <h2 id="basket-title" class="basket-title">Dein Warenkorb</h2>
        <button class="basket-close" type="button" onclick="closeBasket()" aria-label="Warenkorb schließen">✕</button>
      </div>
      <div id="basket-items"></div>
      <div id="basket-summary"></div>
      <button id="order-button" class="basket-order-button" type="button" onclick="placeOrder()">Jetzt
        bestellen
      </button>
    </aside>
  </main>

  <div id="order-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="order-modal-text" hidden>
    <div class="modal-box">
      <p id="order-modal-text" class="modal-text">Bestellung bestätigt!<br>Ihr Essen ist auf dem Weg.</p>
      <button class="modal-close" type="button" onclick="closeOrderModal()">OK</button>
    </div>
  </div>

  <nav class="bottom-nav" aria-label="Hauptnavigation">
    <button class="bottom-nav-button" type="button" aria-label="Start">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>
    <button class="bottom-nav-button" type="button" aria-label="Profil">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="2" />
        <path d="M4 21c1.5-4 5-6 8-6s6.5 2 8 6" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" />
      </svg>
    </button>
    <button class="bottom-nav-button" type="button" aria-label="Speisekarte">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M6 3v9m0 0v9M6 12H4.5C4.5 12 4 9 6 3M18 3v18M14 3c0 4-1 6-1 6s1 2 1 6" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>
    <button class="bottom-nav-button" type="button" onclick="toggleBasket()" aria-label="Warenkorb öffnen">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M3 4h2l2.4 12.4a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.6L21 8H6" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        <circle cx="10" cy="21" r="1.4" fill="currentColor" />
        <circle cx="17" cy="21" r="1.4" fill="currentColor" />
      </svg>
    </button>
  </nav>

  <footer class="footer">
    <span>© 2026 BurgerHouse</span>
    <a href="#">Impressum</a>
    <a href="#">Cookie-Einstellungen</a>
  </footer>

  <script src="./db.js"></script>
  <script src="./template.js"></script>
  <script src="./script.js"></script>
  <script>init();</script>
</body>

</html>
